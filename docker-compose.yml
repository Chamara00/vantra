services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      MONGO_URI: mongodb://mongo:27017/vantra
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ALERTING_SERVICE_URL: http://alerting:3001
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}
    depends_on:
      mongo:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  # Standalone alerting service (src/alerting-service). Same image, own process.
  alerting:
    build: .
    command: ["npm", "run", "start:alerting"]
    ports:
      - "3001:3001"
    environment:
      MONGO_URI: mongodb://mongo:27017/vantra
      PORT: 3001
      MONOLITH_URL: http://app:3000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}
    depends_on:
      mongo:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    # Reserved for dashboard caching work - not yet used by the app.

volumes:
  mongo_data:
